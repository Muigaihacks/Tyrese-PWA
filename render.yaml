services:
  - type: web
    name: sokofresh-backend
    env: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
      php artisan config:cache || true
      php artisan route:cache || true
      php artisan view:cache || true
    startCommand: php artisan migrate --force || true && php artisan db:seed --class=RoleSeeder --force || true && php artisan admin:create-from-env && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql

databases:
  - name: sokofresh-db
    plan: free

