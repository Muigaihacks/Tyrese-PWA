[providers]
php = { version = "8.2", extensions = ["intl", "zip"] }

[phases.setup]
nixPkgs = ["php82", "php82Extensions.intl", "php82Extensions.zip", "php82Packages.composer"]

[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-scripts --no-interaction",
    "npm install",
    "npm run build",
    "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache && chmod -R a+rw storage",
    "php artisan config:cache",
    "php artisan event:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force || true && php artisan db:seed --class=RoleSeeder --force || true && php artisan admin:create-from-env && php artisan serve --host=0.0.0.0 --port=$PORT"

